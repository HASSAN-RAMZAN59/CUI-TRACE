name: cui_trace
description: "CUI Trace App for COMSATS University"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Google Login
  google_sign_in: ^6.1.4

  # Others
  cloudinary_flutter: ^1.0.3
  flutter_local_notifications: ^19.0.0
  provider: ^6.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.3.0
  intl: ^0.20.2
  shared_preferences: ^2.2.1
  uuid: ^4.4.0
  http: ^1.2.0
  path_provider: ^2.1.5
  url_launcher: ^6.2.1
  emoji_picker_flutter: ^4.4.0

  sqflite: ^2.3.0+2
  path: ^1.9.0
  connectivity_plus: ^7.0.0
  mime: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
